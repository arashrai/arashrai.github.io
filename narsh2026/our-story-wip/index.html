<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Narsh 2026 - Our Story WIP">
    <title>Our Story WIP -- Narsh 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.css" rel="stylesheet">
    <link rel="stylesheet" href="/narsh2026/styles.css">
    <link rel="stylesheet" href="/narsh2026/our-story-wip/our-story-wip.css">
  </head>
  <body class="auth-pending">
    <header class="site-header">
      <a href="/narsh2026/" class="site-logo">Narsh 2026</a>
      <button class="nav-toggle" aria-label="Menu" aria-expanded="false" aria-controls="site-nav">
        <span class="nav-toggle-icon"></span>
      </button>
      <nav class="site-nav" id="site-nav">
        <a href="/narsh2026/schedule/">Schedule</a>
        <a href="/narsh2026/travel-accommodations/">Travel & Accommodations</a>
        <a href="/narsh2026/dress-code/">Dress Code</a>
        <a href="/narsh2026/our-story/">Our Story</a>
        <a href="/narsh2026/our-story-wip/" class="active">Our Story WIP</a>
        <a href="/narsh2026/our-people/">Our People</a>
        <a href="/narsh2026/puzzles/">Puzzles</a>
      </nav>
    </header>

    <main>
      <div id="scroll-container" class="scroll-container"></div>
      <div id="map" class="map-container" role="img" aria-label="Interactive world map showing journey lines"></div>
      <div class="map-loading" id="map-loading">Loading 3D Globe...</div>
      <div class="map-error hidden" id="map-error"></div>
      <div class="scroll-prompt" id="scroll-prompt">Scroll to follow journey lines</div>
      
      <!-- Minimal bare-bones card: no photos, just stop title, year, narrative -->
      <div class="story-panel hidden" id="story-panel">
        <div id="story-content">
          <h2 class="stop-heading" id="stop-heading"></h2>
          <p class="stop-year" id="stop-year"></p>
          <div class="stop-narrative" id="stop-narrative"></div>
        </div>
      </div>

      <div class="timeline-bar" id="timeline-bar" role="navigation" aria-label="Story timeline"></div>
    </main>

    <script src="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.js"></script>
    <script src="/narsh2026/auth.js"></script>
    <script src="/narsh2026/nav.js"></script>
    <script src="/narsh2026/our-story-wip/story-data.js"></script>
    <script src="/narsh2026/our-story-wip/map.js"></script>
    <script src="/narsh2026/our-story-wip/scroll-controller.js"></script>
    <script src="/narsh2026/our-story-wip/timeline.js"></script>
    <script>
      const tier = NARSH_AUTH.requireAuth();
      if (tier) {
        NARSH_AUTH.applyTierVisibility(tier);

        const loadingEl = document.getElementById("map-loading");
        const errorEl = document.getElementById("map-error");
        const panelEl = document.getElementById("story-panel");
        const headingEl = document.getElementById("stop-heading");
        const yearEl = document.getElementById("stop-year");
        const narrativeEl = document.getElementById("stop-narrative");
        const promptEl = document.getElementById("scroll-prompt");
        const STOPS = NARSH_STORY_WIP_DATA.STOPS;
        const scrollState = { firstScroll: true };

        const mapResult = NARSH_MAP_WIP.init("map");

        if (mapResult) {
          mapResult.then((map) => {
            if (!map) {
              if (loadingEl) loadingEl.classList.add("hidden");
              return;
            }

            if (loadingEl) loadingEl.classList.add("hidden");

            NARSH_TIMELINE_WIP.init(STOPS, (index) => {
              NARSH_SCROLL_WIP.scrollToStop(index);
            });

            const applyStopContent = (stop) => {
              if (headingEl) headingEl.textContent = stop.location;
              if (yearEl) {
                const people = stop.owner === "both"
                  ? "Arash & Natalie"
                  : (stop.owner === "arash" ? "Arash" : "Natalie");
                yearEl.textContent = stop.year + " · " + people;
              }
              if (narrativeEl) narrativeEl.textContent = stop.narrative;
            };

            const onStopChange = (newIndex, previousIndex) => {
              const stop = STOPS[newIndex];
              if (!stop) return;

              if (scrollState.firstScroll) {
                scrollState.firstScroll = false;
                if (promptEl) promptEl.classList.add("fade-out");
              }

              if (panelEl) {
                panelEl.classList.remove("hidden");
                panelEl.classList.add("visible");
              }

              NARSH_MAP_WIP.flyToStop(stop.coords, stop.zoom, stop.flyVia, stop.wideCoords, stop.wideZoom, stop.isHubTrip, stop.hubCoords);
              NARSH_MAP_WIP.updateLines(newIndex, STOPS);
              NARSH_MAP_WIP.updatePins(newIndex, STOPS);
              NARSH_TIMELINE_WIP.setActive(newIndex);
              NARSH_TIMELINE_WIP.setVisited(newIndex);

              if (stop.isConvergence) {
                NARSH_MAP_WIP.playBowAnimation(stop.coords);
              }

              applyStopContent(stop);
            };

            NARSH_SCROLL_WIP.init(STOPS, onStopChange);

            document.addEventListener("keydown", (e) => {
              if (e.key === "ArrowRight" || e.key === "ArrowDown") {
                e.preventDefault();
                const next = Math.min(NARSH_SCROLL_WIP.getCurrentIndex() + 1, STOPS.length - 1);
                NARSH_SCROLL_WIP.scrollToStop(next);
              } else if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
                e.preventDefault();
                const prev = Math.max(NARSH_SCROLL_WIP.getCurrentIndex() - 1, 0);
                NARSH_SCROLL_WIP.scrollToStop(prev);
              }
            });

            onStopChange(0, -1);
          }).catch(() => {
            if (loadingEl) loadingEl.classList.add("hidden");
            if (errorEl) {
              errorEl.textContent = "The map couldn't load right now. Try refreshing the page.";
              errorEl.classList.remove("hidden");
            }
          });
        }
      }
    </script>
  </body>
</html>
